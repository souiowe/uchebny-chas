<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-label="Окно терминала с командами Git" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="460" fill="#000000"/>
<circle cx="660" cy="90" r="150" fill="#24c2f2" opacity="0.15"><animate attributeName="r" values="150;180;150" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="40" cy="400" r="2.5" fill="#ffffff" opacity="0.18"/><circle cx="100" cy="400" r="2.5" fill="#ffffff" opacity="0.18"/><circle cx="160" cy="400" r="2.5" fill="#ffffff" opacity="0.18"/><circle cx="220" cy="400" r="2.5" fill="#ffffff" opacity="0.18"/><circle cx="280" cy="400" r="2.5" fill="#ffffff" opacity="0.18"/><circle cx="340" cy="400" r="2.5" fill="#ffffff" opacity="0.18"/><circle cx="400" cy="400" r="2.5" fill="#ffffff" opacity="0.18"/><circle cx="460" cy="400" r="2.5" fill="#ffffff" opacity="0.18"/><circle cx="520" cy="400" r="2.5" fill="#ffffff" opacity="0.18"/><circle cx="580" cy="400" r="2.5" fill="#ffffff" opacity="0.18"/><circle cx="640" cy="400" r="2.5" fill="#ffffff" opacity="0.18"/><circle cx="700" cy="400" r="2.5" fill="#ffffff" opacity="0.18"/>
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="5s" repeatCount="indefinite"/>
<rect x="40" y="50" width="680" height="330" rx="16" fill="#0b1215" stroke="#394649" stroke-width="2"/>
<circle cx="70" cy="80" r="7" fill="#ea4335"/><circle cx="95" cy="80" r="7" fill="#f6b60b"/><circle cx="120" cy="80" r="7" fill="#55da9b"/>
<text x="696" y="86" text-anchor="end" font-family="monospace" font-size="18" fill="#757575">terminal</text>
<text xml:space="preserve" x="70" y="150" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="24"><tspan fill="#6b7a86"># Один час в день</tspan></text>
<text xml:space="preserve" x="70" y="196" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="24"><tspan fill="#e6edf3">$ git switch -c feature/home</tspan></text>
<text xml:space="preserve" x="70" y="242" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="24"><tspan fill="#e6edf3">$ git add .</tspan></text>
<text xml:space="preserve" x="70" y="288" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="24"><tspan fill="#e6edf3">$ git commit -m </tspan><tspan fill="#ffd866">"Готово"</tspan></text>
<text xml:space="preserve" x="70" y="334" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="24"><tspan fill="#55da9b">✔ </tspan><tspan fill="#e6edf3">урок пройден</tspan></text>
<rect x="276.272" y="314" width="13" height="28" fill="#ffffff"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></rect>
</g>
</svg>